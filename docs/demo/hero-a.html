<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DSH Skin Studio · 一张图，长成一套皮肤</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #111513; }
    #stage { position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden; }
    #canvas { position: relative; width: 1920px; height: 1080px; overflow: hidden; transform-origin: center; background: radial-gradient(900px 620px at 73% 31%, rgb(224 121 76 / 18%), transparent 65%), radial-gradient(820px 580px at 19% 84%, rgb(52 164 147 / 13%), transparent 63%), linear-gradient(130deg, #151a17, #101311 72%); }
    #canvas::before { content: ""; position: absolute; inset: 0; opacity: .34; background-image: linear-gradient(rgb(243 241 234 / 4%) 1px, transparent 1px), linear-gradient(90deg, rgb(243 241 234 / 4%) 1px, transparent 1px); background-size: 72px 72px; mask-image: linear-gradient(90deg, #000, transparent 80%); }
    .eyebrow { position: absolute; left: 132px; top: 94px; z-index: 4; color: #48bdaf; font: 700 18px/1 "Cascadia Code", Consolas, monospace; letter-spacing: .18em; }
    .headline { position: absolute; left: 126px; top: 145px; z-index: 4; width: 670px; color: #f4f1ea; font-family: "Segoe UI Variable", "Microsoft YaHei UI", sans-serif; }
    .headline strong { display: block; font-size: 78px; line-height: 1.04; letter-spacing: -.045em; }
    .headline strong em { color: #e6794d; font-style: normal; }
    .headline p { width: 530px; margin: 24px 0 0; color: rgb(244 241 234 / 66%); font-size: 23px; line-height: 1.62; }
    .steps { position: absolute; left: 132px; top: 455px; z-index: 5; display: flex; gap: 12px; }
    .step { min-width: 138px; padding: 12px 16px; border: 1px solid rgb(243 241 234 / 15%); border-radius: 999px; background: rgb(20 25 22 / 72%); color: rgb(243 241 234 / 62%); font: 600 15px/1 "Segoe UI Variable", "Microsoft YaHei UI", sans-serif; backdrop-filter: blur(12px); }
    .step b { margin-right: 7px; color: #e6794d; font: 700 12px/1 "Cascadia Code", Consolas, monospace; }
    .step.active { color: #f4f1ea; border-color: rgb(72 189 175 / 75%); box-shadow: 0 0 0 1px rgb(72 189 175 / 20%), 0 12px 30px -18px rgb(72 189 175 / 75%); }
    .product-wrap { position: absolute; left: 770px; top: 154px; z-index: 3; width: 1320px; height: 742px; transform-origin: 47% 48%; }
    .product-shadow { position: absolute; inset: 56px -78px -108px 90px; border-radius: 50%; background: rgb(0 0 0 / 52%); filter: blur(42px); transform: rotate(-4deg); }
    .product { position: relative; width: 1280px; height: 720px; overflow: hidden; border: 1px solid rgb(244 241 234 / 22%); border-radius: 16px; background: #202321; box-shadow: 0 48px 100px -44px rgb(0 0 0 / 95%), 0 18px 32px -22px rgb(0 0 0 / 72%); }
    .product img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .product::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(132deg, rgb(255 255 255 / 10%), transparent 20%, transparent 71%, rgb(0 0 0 / 15%)); }
    .focus { position: absolute; z-index: 5; border: 2px solid #48bdaf; border-radius: 10px; box-shadow: 0 0 0 900px rgb(8 11 10 / 28%), 0 0 0 6px rgb(72 189 175 / 13%), 0 18px 34px -18px rgb(0 0 0 / 92%); opacity: 0; }
    .focus .label { position: absolute; left: 0; top: -43px; padding: 9px 13px; border: 1px solid rgb(72 189 175 / 55%); border-radius: 8px; white-space: nowrap; color: #f4f1ea; background: rgb(19 31 28 / 94%); font: 700 14px/1 "Segoe UI Variable", "Microsoft YaHei UI", sans-serif; }
    .focus .label small { margin-left: 8px; color: #48bdaf; font: 600 10px/1 "Cascadia Code", Consolas, monospace; letter-spacing: .08em; }
    #safe-note { position: absolute; right: 105px; bottom: 112px; z-index: 7; width: 410px; padding: 22px 25px; border: 1px solid rgb(244 241 234 / 16%); border-radius: 14px; background: rgb(23 29 26 / 89%); box-shadow: 0 28px 48px -30px rgb(0 0 0 / 90%); opacity: 0; backdrop-filter: blur(16px); }
    #safe-note b { display: block; color: #f4f1ea; font: 750 24px/1.2 "Segoe UI Variable", "Microsoft YaHei UI", sans-serif; }
    #safe-note p { margin: 10px 0 0; color: rgb(244 241 234 / 63%); font: 15px/1.6 "Segoe UI Variable", "Microsoft YaHei UI", sans-serif; }
    #safe-note i { display: inline-block; width: 9px; height: 9px; margin-right: 8px; border-radius: 50%; background: #48bdaf; box-shadow: 0 0 15px rgb(72 189 175 / 85%); }
    .footer { position: absolute; left: 132px; bottom: 86px; z-index: 4; color: rgb(244 241 234 / 38%); font: 600 14px/1 "Cascadia Code", Consolas, monospace; letter-spacing: .1em; }
    .footer b { color: #f4f1ea; }
    .end-card { position: absolute; inset: 0; z-index: 8; display: grid; place-items: center; opacity: 0; pointer-events: none; background: radial-gradient(760px 430px at 50% 49%, rgb(230 121 77 / 17%), transparent 70%); }
    .end-card div { text-align: center; }
    .end-card h2 { margin: 0; color: #f4f1ea; font: 800 92px/1 "Segoe UI Variable", "Microsoft YaHei UI", sans-serif; letter-spacing: -.05em; }
    .end-card h2 em { color: #e6794d; font-style: normal; }
    .end-card p { margin: 23px 0 0; color: rgb(244 241 234 / 64%); font: 600 22px/1 "Cascadia Code", Consolas, monospace; letter-spacing: .08em; }
    .no-record { position: fixed; right: 14px; bottom: 12px; color: rgb(255 255 255 / 18%); font: 11px/1 monospace; }
  </style>
</head>
<body>
  <main id="stage"><section id="canvas" aria-label="DSH Skin Studio product tour">
    <div class="eyebrow" id="eyebrow">DSH SKIN STUDIO</div>
    <div class="headline" id="headline"><strong>一张图，<em>长成</em>一套皮肤</strong><p>从双区域设计到真实隔离预览；确认之前，绝不改动你的 DeepSeek Harness。</p></div>
    <div class="steps" id="steps"><span class="step" data-step="0"><b>01</b>设计皮肤</span><span class="step" data-step="1"><b>02</b>隔离预览</span><span class="step" data-step="2"><b>03</b>人工确认</span></div>
    <div class="product-wrap" id="productWrap"><div class="product-shadow"></div><div class="product"><img src="../../apps/studio/artifacts/studio-final-desktop.png" alt="真实 DSH Skin Studio 界面" /></div></div>
    <div class="focus" id="focus"><span class="label" id="focusLabel">区域设计 <small>LIVE CONTROLS</small></span></div>
    <aside id="safe-note"><b><i></i>真实隔离预览</b><p>预览在独立 DSH 中完成。写入操作必须由你在可见的 Studio 内亲自确认。</p></aside>
    <div class="footer"><b>IMAGE → SKIN → DSH</b> · LOCAL-FIRST · HUMAN CONFIRMED</div>
    <div class="end-card" id="endCard"><div><h2>看见以后，<em>再写入。</em></h2><p>DESIGN · PREVIEW · APPLY</p></div></div>
  </section></main>
  <div class="no-record">dsh-visual-skin demo · 10s</div>
  <script>
    (() => {
      const DURATION = 10;
      const canvas = document.getElementById('canvas');
      const productWrap = document.getElementById('productWrap');
      const headline = document.getElementById('headline');
      const eyebrow = document.getElementById('eyebrow');
      const focus = document.getElementById('focus');
      const focusLabel = document.getElementById('focusLabel');
      const safeNote = document.getElementById('safe-note');
      const endCard = document.getElementById('endCard');
      const steps = [...document.querySelectorAll('[data-step]')];
      const clamp = value => Math.max(0, Math.min(1, value));
      const segment = (t, start, end) => clamp((t - start) / (end - start));
      const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      const mix = (a, b, t) => a + (b - a) * t;
      const fade = (t, start, inEnd, outStart, end) => ease(segment(t, start, inEnd)) * (1 - ease(segment(t, outStart, end)));
      const setFocus = (x, y, w, h, text, code, opacity) => {
        focus.style.left = `${x}px`; focus.style.top = `${y}px`; focus.style.width = `${w}px`; focus.style.height = `${h}px`;
        focusLabel.innerHTML = `${text} <small>${code}</small>`; focus.style.opacity = opacity.toFixed(3);
      };
      const render = time => {
        const t = Math.max(0, Math.min(DURATION, time));
        const arrive = ease(segment(t, 0, 1.25));
        const preview = ease(segment(t, 3.0, 4.05));
        const confirm = ease(segment(t, 5.85, 6.9));
        const closing = ease(segment(t, 8.25, 9.35));
        const x = mix(700, 560, preview) + mix(0, 22, confirm);
        const y = mix(162, 222, preview) + mix(0, 15, confirm);
        const scale = mix(.89, 1.0, arrive) * mix(1, 1.17, preview) * mix(1, .90, closing);
        const rot = mix(-5.5, -1.2, arrive) * (1 - preview) + mix(-1.2, 0, preview);
        productWrap.style.transform = `translate(${(x - 770).toFixed(1)}px, ${(y - 154).toFixed(1)}px) scale(${scale.toFixed(4)}) perspective(1700px) rotateY(${rot.toFixed(2)}deg)`;
        productWrap.style.opacity = (1 - closing * .82).toFixed(3);
        headline.style.opacity = (1 - preview * .92 - closing * .08).toFixed(3);
        headline.style.transform = `translateY(${(1 - arrive) * 18 - preview * 9}px)`;
        eyebrow.style.opacity = (1 - closing).toFixed(3);
        steps.forEach((step, index) => step.classList.toggle('active', index === (t < 3.0 ? 0 : t < 5.85 ? 1 : 2)));
        const designOpacity = fade(t, 1.55, 2.05, 2.85, 3.35);
        const previewOpacity = fade(t, 3.15, 3.65, 5.45, 5.95);
        const confirmOpacity = fade(t, 6.0, 6.45, 7.85, 8.35);
        if (designOpacity > .01) setFocus(1655, 198, 278, 530, '背景与视觉处理', 'DESIGN', designOpacity);
        else if (previewOpacity > .01) setFocus(856, 256, 700, 433, '真实隔离预览', 'ISOLATED', previewOpacity);
        else if (confirmOpacity > .01) setFocus(1653, 49, 160, 54, '写入前确认', 'HUMAN', confirmOpacity);
        else focus.style.opacity = '0';
        safeNote.style.opacity = confirmOpacity.toFixed(3);
        safeNote.style.transform = `translateY(${(1 - confirmOpacity) * 16}px)`;
        endCard.style.opacity = closing.toFixed(3);
      };
      const fit = () => { const scale = Math.min(innerWidth / 1920, innerHeight / 1080); canvas.style.transform = `scale(${scale})`; };
      let started = performance.now();
      let playing = true;
      const tick = now => { if (!playing) return; const t = Math.min((now - started) / 1000, DURATION); render(t); if (t >= DURATION) started = now; requestAnimationFrame(tick); };
      window.__seek = value => { playing = false; render(value); };
      window.__ready = true;
      addEventListener('resize', fit); fit(); render(0); if (!window.__recording) requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
